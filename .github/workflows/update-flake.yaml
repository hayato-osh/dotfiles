name: "Update flake inputs"
on:
  schedule:
    # 毎週月曜 03:00 UTC (JST 12:00)
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # --commit-lock-file は付けない。runner に git の identity が無くコミットに
      # 失敗する上、コミットは create-pull-request 側が作るので二重になる。
      - name: Update flake.lock
        run: nix flake update
      # Linux では darwin 構成を評価できないのでスキーマ検査のみ (lint.yaml 参照)。
      # 構成のビルドはこの PR に対して走る lint.yaml の build-darwin が確認する。
      - name: Evaluate flake outputs
        run: nix flake check --all-systems --no-build --show-trace
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-flake-lock
          title: "chore: update flake.lock"
          commit-message: "chore: update flake.lock"
          body: |
            `nix flake update` の自動 PR。

            作成から数日寝かせてからマージする (公開直後の汚染版を避けるクールダウン)。

            マージ後、各マシンで `sudo darwin-rebuild switch --flake .#<profile>` を実行する。
          delete-branch: true
