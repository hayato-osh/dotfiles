name: "CI: Lint"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # フォーマットと flake 出力のスキーマ検査。Linux で完結するので軽い。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate flake outputs
        run: nix flake check --all-systems --no-build --show-trace
      - name: Check formatting
        run: nix build .#checks.x86_64-linux.formatting --print-build-logs
  # lazyvim-nix が IFD を使うので Linux からは評価できず macOS runner が必須。
  build-darwin:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build personal configuration
        run: |
          nix build ".#darwinConfigurations.personal.system" \
            --no-link --print-build-logs --show-trace
